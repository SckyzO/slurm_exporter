# =============================================================================
# cluster.conf — Slurm test cluster configuration
#
# Compatible with both Make (include) and bash (source).
# Override locally: create cluster.local.conf (gitignored).
# =============================================================================

# ── Cluster ───────────────────────────────────────────────────────────────────

# Path to a local clone of https://github.com/giovtorres/slurm-docker-cluster
# Leave empty for auto-detection.
CLUSTER_DIR=

# Slurm version to run the cluster on.
#   - Recent 25.11.x majors are pulled from Docker Hub (giovtorres/slurm-docker-cluster:<ver>).
#   - Any other supported major (e.g. 26.05.2, 25.05.8, 24.11.x) has NO published
#     tag, so the harness builds it from source — it must be a version SchedMD
#     still ships a tarball for: https://download.schedmd.com/slurm/slurm-<ver>.tar.bz2
# Switching major between two runs needs a `make clean` first: the MariaDB and
# Slurm state volumes are version-sensitive and are not shared across majors (#187, #189).
SLURM_VERSION=25.11.2

# Digest-pinned MariaDB. The clone's docker-compose.yml pins the floating tag
# mariadb:12, and var_lib_mysql persists across runs — so the day Docker Hub
# moves 12.x, the volume's system tables are the previous minor's, mysql.proc
# has the wrong column count, and slurmdbd aborts with SIGABRT (#187). Pinning
# a digest turns a bump into a deliberate act (one make clean) instead of a
# silent break. This is 12.3.2; bump it with: docker inspect mariadb:12
# --format '{{index .RepoDigests 0}}' after a working pull, then make clean.
MARIADB_IMAGE=mariadb@sha256:628f228f0fd5913a220438693576b29b6fe4dc1fa0a1298c0e98579fae28635f

# Number of CPU compute nodes
NODES=10

# ── Monitoring ────────────────────────────────────────────────────────────────

GRAFANA_URL=http://localhost:3000
GRAFANA_USER=admin
GRAFANA_PASS=admin

# ── Slurm Accounts ────────────────────────────────────────────────────────────
# Space-separated, format: NAME:DESCRIPTION:ORGANIZATION
ACCOUNTS="hpc_team:HPC-Team:lab ml_group:ML-Group:lab physics:Physics-Dept:lab bio:Bioinformatics:lab"

# ── Users ─────────────────────────────────────────────────────────────────────
# Space-separated, format: NAME:UID:DEFAULT_ACCOUNT
# UIDs must be unique and consistent across all containers.
USERS="alice:1000:hpc_team bob:1001:ml_group carol:1002:physics dave:1003:bio eve:1004:ml_group frank:1005:hpc_team"

# ── Extra Partitions ──────────────────────────────────────────────────────────
# Space-separated, format: NAME:NODES:MAXTIME_MIN:PRIORITY:DEFAULT
# MAXTIME_MIN=0 means INFINITE. DEFAULT: YES or NO.
PARTITIONS="debug:c[1-2]:30:1:NO high:c[1-3]:0:100:NO"

# ── Playwright ────────────────────────────────────────────────────────────────

# Docker image + npm version must match (browser binaries bundled per image version)
PLAYWRIGHT_IMAGE=mcr.microsoft.com/playwright:v1.58.2-noble
PLAYWRIGHT_VERSION=1.58.2
