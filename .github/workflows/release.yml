name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tagged version must have a CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="${version%%-*}"          # v2.0.0-rc1 -> 2.0.0
          # Dots are wildcards in a regex, so 1.8.5 would also match [1x8x5].
          esc=$(printf '%s' "$base" | sed 's/\./\\./g')
          if [ "$version" != "$base" ]; then
            # Pre-release: the section may still be [Unreleased] at this point.
            if grep -qE "^## \[($esc|Unreleased)\]" CHANGELOG.md; then
              echo "ok: pre-release $TAG has a section to ship under"
              exit 0
            fi
            echo "::error::CHANGELOG.md has neither a [$base] nor an [Unreleased] section for $TAG."
            exit 1
          fi
          if grep -qE "^## \[$esc\]" CHANGELOG.md; then
            echo "ok: CHANGELOG.md documents $base"
            exit 0
          fi
          echo "::error::CHANGELOG.md has no '## [$base]' section on the commit being tagged."
          echo "A release with no changelog entry is invisible to everyone who did not"
          echo "write it. Rename the [Unreleased] heading to [$base] with today's date,"
          echo "and if this tag is cut from a maintenance branch, carry the section back"
          echo "to master as well."
          exit 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - run: make test

  release:
    runs-on: ubuntu-latest
    needs:
      - changelog
      - lint
      - test
    permissions:
      contents: write # needed to write releases
      id-token: write # needed for keyless signing
      packages: write # needed for ghcr access
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Set build environment variables
        run: |
          echo "BUILD_DATE=$(date +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "GO_VERSION=$(go version)" >> "$GITHUB_ENV"
      - name: Debug Git State
        run: |
          echo "Current commit:"
          git log -n 1
          echo "All tags:"
          git tag -l
          echo "HEAD commit hash:"
          git rev-parse HEAD
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_PASS" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKER_TOKEN }}
        run: echo "$DOCKERHUB_PASS" | docker login docker.io -u "$DOCKERHUB_USER" --password-stdin
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pinned: dockers_v2 changed its build-context layout in goreleaser
          # 2.16 (artifacts moved under $TARGETPLATFORM/), which breaks the
          # Dockerfile COPY. 2.15.4 is the version that shipped v1.8.3.
          version: '2.15.4'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_USER: "${{ github.actor }}"
          BUILD_DATE: ${{ env.BUILD_DATE }}
          GO_VERSION: ${{ env.GO_VERSION }}
          BRANCH_NAME: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
