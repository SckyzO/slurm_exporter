# Build of the containerised tool image that `make check` runs inside.
#
# Nothing else in CI builds it. The lint and test jobs use setup-go and
# golangci-lint-action, so the merge gate can stay green while
# scripts/docker/tools no longer builds at all — which is exactly what
# happened: osv-scanner raised its `go` directive past the pinned toolchain
# and `make check`, `make test` and `make lint` stopped working on every
# branch for six weeks before anyone noticed. A contributor cannot discharge
# the Definition of Done in that state.
#
# Two triggers, because there are two ways this breaks:
#
#   paths     — someone edits the Dockerfile, bumps the toolchain, or moves a
#               tool pin, and finds out in the pull request instead of later.
#   schedule  — the repository is unchanged and upstream rots underneath it:
#               a pinned version is yanked, a module path moves, a registry
#               stops serving a digest. Nothing in the diff can predict that,
#               so it has to be checked on a clock.
#
# The job does not stop at a successful build. Layers can build while a binary
# is missing from $PATH or refuses to start, so each tool is asked for its
# version: that is what proves the image is usable rather than merely built.

name: Tools image

on:
  push:
    branches: [master, 'release-*']
    paths:
      - 'scripts/docker/tools/**'
      - '.github/workflows/tools-image.yml'
  pull_request:
    paths:
      - 'scripts/docker/tools/**'
      - '.github/workflows/tools-image.yml'
  schedule:
    # Mondays, after the Dependabot run at 05:00 Europe/Paris.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the tools image
        run: make tools-image

      - name: Every tool is on PATH and runnable
        run: |
          set -euo pipefail
          # `command -v` is the existence check: a missing binary makes it
          # fail, where running the binary and looking for output does not —
          # `sh -c 'foo --version'` on an absent foo still prints
          # "sh: foo: not found" to stderr, which would read as success.
          for name in gocyclo misspell ineffassign golangci-lint govulncheck \
                      actionlint gitleaks osv-scanner deadcode shellcheck zizmor
          do
            if ! docker run --rm --entrypoint sh slurm_exporter-tools:latest \
                   -c "command -v $name >/dev/null"; then
              printf '  FAIL %s is not on PATH in the image\n' "$name"
              exit 1
            fi
            printf '  ok   %s\n' "$name"
          done

      - name: The versions installed are the versions pinned
        run: |
          set -euo pipefail
          # Only the tools that report a version. gocyclo, ineffassign and
          # deadcode have no version flag, and gitleaks installed with
          # `go install` reports "set by build process", so they are covered
          # by the PATH check above and nothing further is claimed here.
          #
          # The whole output is searched, not its first line: govulncheck
          # prints the Go version first and its own on a later line, so
          # matching head -1 would assert the toolchain and silently never
          # check the pin.
          expect() {
            got=$(docker run --rm --entrypoint sh slurm_exporter-tools:latest \
                    -c "$2" 2>&1 || true)
            if printf '%s' "$got" | grep -qF "$3"; then
              printf '  ok   %-14s %s\n' "$1" "$3"
            else
              printf '  FAIL %-14s expected to contain %s, got:\n%s\n' "$1" "$3" "$got"
              exit 1
            fi
          }
          expect golangci-lint 'golangci-lint version' 'version 2.15.0'
          expect govulncheck   'govulncheck -version'  'govulncheck@v1.6.0'
          expect actionlint    'actionlint -version'   '1.7.12'
          expect osv-scanner   'osv-scanner --version' '2.5.1'
