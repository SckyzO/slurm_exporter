# CI — lint + test on every pull request and on push to master.
#
# This is the gate that the CONTRIBUTING.md "Definition of Done" (steps 1-3)
# expects on every change. The release workflow only runs on tags, so without
# this nothing ran the test suite or the linter on PRs. Integration tests
# (the Slurm test cluster in scripts/testing/) remain a manual step.

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Build
        run: go build -v ./...
      # test_data/readme.md is generated from the command registry in
      # internal/collector. Regenerating it here would hide the drift; failing
      # is the point (issue #195).
      - name: Derived docs are current
        run: go run ./tools/gen-fixture-doc -check
      - name: Test (race + coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
